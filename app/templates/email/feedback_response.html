<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Ami Goans responded to your {{ feedback.kind }}</title></head>
<body style="margin:0;padding:0;background-color:#f7f3ec;font-family:Arial,Helvetica,sans-serif;color:#322a22;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f3ec;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#5f7052;padding:20px 32px;">
              <span style="color:#ffffff;font-size:20px;font-weight:bold;">Ami Goans</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="font-size:18px;margin:0 0 16px;">We responded to {{ "your idea" if feedback.kind == "idea" else "your issue report" }}</h1>
              <p style="font-size:14px;line-height:1.5;margin:0 0 16px;">Hi {{ feedback.submitted_by.display_name }},</p>
              <p style="font-size:13px;line-height:1.5;color:#776c60;margin:0 0 16px;font-style:italic;">
                "{{ feedback.title or feedback.description[:80] }}"
              </p>
              <p style="font-size:14px;line-height:1.5;margin:0 0 24px;white-space:pre-line;">{{ feedback.admin_response }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
