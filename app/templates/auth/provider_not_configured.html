{% extends "base.html" %}
{% block title %}{{ provider }} Sign-In{% endblock %}
{% block content %}
<section class="ag-section">
  <div class="container ag-narrow">
    <div class="ag-card ag-auth-card">
      <h1 class="ag-heading-serif">{{ provider }} Sign-In Not Yet Configured</h1>
      <p>Sign-in with {{ provider }} will be available once this integration is configured.</p>
      <a class="btn ag-btn-primary" href="{{ url_for('auth.sign_in') }}">Back to Sign In</a>
    </div>
  </div>
</section>
{% endblock %}
