{% extends "base.html" %}
{% from "components/_form_field.html" import field %}
{% block title %}Edit Photo{% endblock %}
{% block content %}
<section class="ag-section">
  <div class="container ag-narrow">
    <div class="ag-card ag-auth-card">
      <h1 class="ag-heading-serif">Edit Photo</h1>
      <p>
        Status:
        <span class="ag-badge ag-badge-inline ag-badge-status-{{ photo.status }}">{{ photo.status|capitalize }}</span>
      </p>

      <img src="{{ url_for('static', filename='uploads/photos/' ~ photo.image) }}" alt="{{ photo.caption }}" class="img-fluid rounded mb-3">

      <form method="POST" enctype="multipart/form-data" novalidate>
        {{ form.hidden_tag() }}
        {{ field(form.caption) }}
        {{ field(form.image) }}
        <button type="submit" class="btn ag-btn-primary w-100 mt-3">Save Changes</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
