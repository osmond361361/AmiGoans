{% extends "base.html" %}
{% block title %}Edit {{ business.name }}{% endblock %}
{% block content %}
<section class="ag-section">
  <div class="container ag-narrow">
    <div class="ag-card ag-auth-card">
      <h1 class="ag-heading-serif">Edit {{ business.name }}</h1>
      <p>
        Status:
        <span class="ag-badge ag-badge-inline ag-badge-status-{{ business.status }}">{{ business.status|capitalize }}</span>
      </p>

      <form method="POST" enctype="multipart/form-data" novalidate>
        {{ form.hidden_tag() }}
        {% include "businesses/_business_form_fields.html" %}
        <button type="submit" class="btn ag-btn-primary w-100 mt-3">Save Changes</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
